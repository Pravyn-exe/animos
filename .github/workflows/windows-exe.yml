name: Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm install --save-dev electron electron-builder
      - run: npx electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Animos-Windows
          path: release/*.exe
